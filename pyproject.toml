[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mindlatticeai"
version = "0.1.0"
description = "Adaptive AI orchestration framework with execution-history learning, cognitive DAGs, and evolvable prompt genomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Raitul Hasan Priyo" },
  { name = "MindLatticeAI Contributors" }
]
keywords = [
  "ai",
  "agents",
  "orchestration",
  "adaptive-routing",
  "prompt-optimization",
  "execution-graphs",
  "research"
]
dependencies = [
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21"
]

[project.urls]
Homepage = "https://github.com/raitulh/MindLatticeAI"
Issues = "https://github.com/raitulh/MindLatticeAI/issues"
Repository = "https://github.com/raitulh/MindLatticeAI.git"

[tool.hatch.build.targets.wheel]
packages = ["src/mindlatticeai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

